    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none; /* Prevent text selection */
            -webkit-tap-highlight-color: transparent;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-scaleIn {
            animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes pulse-count {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .animate-count {
            animation: pulse-count 0.8s ease-out forwards;
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 20s linear infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .app-root {
            height: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            flex-shrink: 0;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .report-root {
            height: auto;
            display: flex;
            flex-direction: column;
        }

        .report-header,
        .report-summary,
        .grade-selector {
            flex-shrink: 0;
        }

        .grammar-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .wrong-overlay{
            position: fixed;
            inset: 0;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20vh;
            font-weight: 900;
            color: #dc2626;
            z-index: 9999;
            pointer-events: none;
        }
        .wrong-overlay.hidden{
            display: none;
        }
    </style>
</head>

        ];

        const CROSS_GRADE_COURSE_ENTRIES = {
            '中学2年': ['g3_passive', 'g3_svoc_call_make_name', 'g3_let_help_person_verb']
        };

        const RANKING_CONFIG = {
            endpointStorageKey: 'english_knock_v3_ranking_endpoint',
            anonymousIdStorageKey: 'english_knock_v3_anonymous_id',
            adminTokenStorageKey: 'english_knock_v3_admin_token',
            overallLimit: 50,
            courseLimit: 30,
            gradeTabs: ['全体', '中学1年', '中学2年', '中学3年', '基本文']
        };

        const BASIC_SENTENCE_COURSES = [
            { id: 'basic_g1', grade: '基本文', basicGrade: 1, category: '1年の基本文', description: '中学1年の基本文を練習します。', displayLabel: '1年' },
            { id: 'basic_g2', grade: '基本文', basicGrade: 2, category: '2年の基本文', description: '中学2年の基本文を練習します。', displayLabel: '2年' },
            { id: 'basic_g3', grade: '基本文', basicGrade: 3, category: '3年の基本文', description: '中学3年の基本文を練習します。', displayLabel: '3年' },
            { id: 'basic_all', grade: '基本文', basicGrade: 'all', category: '全学年の基本文', description: '1年・2年・3年の基本文をまとめて練習します。', displayLabel: '全学年' },
        ];

        const NICKNAME_RULES = {
            minLength: 2,
            maxLength: 12,
            bannedPatterns: [
                /死ね/i,
                /しね/i,
                /sex/i,
                /sexy/i,
                /ちんこ/i,
                /まんこ/i,
                /おっぱい/i,
                /fuck/i,
                /shit/i,
                /bitch/i
            ],
            personalInfoPatterns: [
                /@/,
                /https?:\/\//i,
                /\d{7,}/,
                /学校|小学校|中学校|高校|大学|クラス|組|出席番号|電話|line|インスタ|instagram|tiktok|住所|本名/i
            ]
        };

        /**
         * ------------------------------------------------------------------
         * STATE MANAGEMENT
         * ------------------------------------------------------------------
         */
        const state = {
            view: 'start', // start, menu, grade_select, course_select, basic_sentence_select, countdown, history, leaderboard, leaderboard_admin, game, result, mistake_review
            selectedGrade: '中学2年',
            mode: 'normal', // normal, review2
            reviewContext: null,
            ui: {
                nicknameError: ''
            },
            userData: { nickname: '', totalScore: 0, history: [], bestScores: {} },
            ranking: {
                endpoint: '',
                entries: [],
                loading: false,
                syncMessage: '',
                lastSyncAt: null,
                scope: 'overall',
                selectedGrade: '中学1年',
                selectedCourseId: null,
                adminToken: '',
                adminEntries: [],
                adminLoading: false,
                adminMessage: '',
                adminScope: 'overall',
                adminSelectedGrade: '中学1年',
                adminSelectedCourseId: null
            },
            game: {
                activeCourseId: null,
                timeLeft: 60,
                score: 0,
                combo: 0,
                maxCombo: 0,
                questionQueue: [],
                courseScores: null,
                currentQ: null,
                shuffledChunks: [],
                selectedIndices: [],
                isCorrect: null, // null, true, false
                wrongAnswers: [],
                correctCount: 0,
                attemptCount: 0,
                contextLabel: '',
                startTime: 0,
                timerInterval: null
            }
        };

        // Load data from localStorage
        const savedData = localStorage.getItem('english_knock_v3_data');
            if (savedData) {
                state.userData = { ...state.userData, ...JSON.parse(savedData) };
            }

            if (!state.userData.scoreLogs) state.userData.scoreLogs = [];
            if (!state.userData.anonymousId) {
                state.userData.anonymousId = loadOrCreateAnonymousId();
            }
            state.ranking.endpoint = localStorage.getItem(RANKING_CONFIG.endpointStorageKey) || '';
            state.ranking.adminToken = localStorage.getItem(RANKING_CONFIG.adminTokenStorageKey) || '';

        /**
         * ------------------------------------------------------------------
         * CORE LOGIC
         * ------------------------------------------------------------------
         */
        
        // Helper: TTS
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => 
                (v.name.includes('Google') && v.lang.includes('en-US')) || 
                (v.name.includes('Natural') && v.lang.includes('en-US')) ||
                v.lang === 'en-US'
            );
            if (preferredVoice) utterance.voice = preferredVoice;
            window.speechSynthesis.speak(utterance);
        }

        // Helper: Simple Beep Sound
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq = 440, type = 'sine', duration = 0.1) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Helper: Save Data
        function saveData() {
            localStorage.setItem('english_knock_v3_data', JSON.stringify(state.userData));
        }

        function loadOrCreateAnonymousId() {
            const existing = localStorage.getItem(RANKING_CONFIG.anonymousIdStorageKey);
            if (existing) return existing;
            const created = `player-${Math.random().toString(36).slice(2, 10)}${Date.now().toString(36)}`;
            localStorage.setItem(RANKING_CONFIG.anonymousIdStorageKey, created);
            return created;
        }

        function getRankingEndpoint() {
            return (state.ranking.endpoint || '').trim();
        }

        function hasRankingEndpoint() {
            return !!getRankingEndpoint();
        }

        function saveRankingEndpoint(endpoint) {
            state.ranking.endpoint = endpoint.trim();
            localStorage.setItem(RANKING_CONFIG.endpointStorageKey, state.ranking.endpoint);
        }

        function saveAdminToken(token) {
            state.ranking.adminToken = token.trim();
            localStorage.setItem(RANKING_CONFIG.adminTokenStorageKey, state.ranking.adminToken);
        }

        function hasAdminToken() {
            return !!(state.ranking.adminToken || '').trim();
        }

        function normalizeNickname(name) {
            return String(name || '').trim().replace(/\s+/g, ' ');
        }

        function validateNickname(name) {
            const normalized = normalizeNickname(name);
            if (normalized.length < NICKNAME_RULES.minLength) {
                return `ニックネームは${NICKNAME_RULES.minLength}文字以上にしてください。`;
            }
            if (normalized.length > NICKNAME_RULES.maxLength) {
                return `ニックネームは${NICKNAME_RULES.maxLength}文字以内にしてください。`;
            }
            if (NICKNAME_RULES.bannedPatterns.some(pattern => pattern.test(normalized))) {
                return '不適切な言葉は使えません。';
            }
            if (NICKNAME_RULES.personalInfoPatterns.some(pattern => pattern.test(normalized))) {
                return '個人情報や個人を特定できる名前は使えません。';
            }
            return '';
        }

        function getRankableCoursesByGrade(grade) {
            if (grade === '基本文') return BASIC_SENTENCE_COURSES;
            return ENGLISH_KNOCK_CONTENT.filter(course => course.grade === grade);
        }

        function getCourseMeta(courseId) {
            return ENGLISH_KNOCK_CONTENT.find(course => course.id === courseId)
                || BASIC_SENTENCE_COURSES.find(course => course.id === courseId)
                || null;
        }

        function getCourseLabel(courseId) {
            if (courseId === 'review1') return '総復習（中1）';
            if (courseId === 'review2') return '総復習（中2）';
            if (courseId === 'review3') return '総復習（中3）';
            const course = getCourseMeta(courseId);
            return course ? course.category : 'トレーニング';
        }

        function tokenizeEnglishSentence(sentence) {
            return String(sentence || '').match(/[A-Za-z]+(?:['’][A-Za-z]+)?|[0-9]+|[.,!?]/g) || [];
        }

        function getBasicSentenceQuestions(courseId) {
            const meta = getCourseMeta(courseId);
            if (!meta || !String(courseId).startsWith('basic_')) return [];
            const source = meta.basicGrade === 'all'
                ? BASIC_SENTENCES
                : BASIC_SENTENCES.filter(item => item.grade === meta.basicGrade);
            return source.map(item => ({
                text: item.english,
                jp: item.japanese,
                context: item.context || '',
                chunks: tokenizeEnglishSentence(item.english),
                courseId
            })).filter(q => q.text && q.jp && q.chunks.length > 0);
        }

        function shuffleQuestionsWithoutRepeat(questions) {
            const shuffled = [...questions].sort(() => Math.random() - 0.5);
            if (shuffled.length > 1 && shuffled[0] === shuffled[shuffled.length - 1]) {
                shuffled.push(shuffled.shift());
            }
            return shuffled;
        }

        function formatSyncTime(value) {
            if (!value) return '';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';
            return date.toLocaleString('ja-JP', {
                month: 'numeric',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getRankingRequestInfo() {
            if (state.ranking.scope === 'course' && state.ranking.selectedCourseId) {
                return {
                    mode: 'course',
                    limit: RANKING_CONFIG.courseLimit,
                    courseId: state.ranking.selectedCourseId
                };
            }
            return {
                mode: 'overall',
                limit: RANKING_CONFIG.overallLimit,
                courseId: null
            };
        }

        function setRankingScope(scope, grade = state.ranking.selectedGrade, courseId = null) {
            state.ranking.scope = scope;
            state.ranking.selectedGrade = grade;
            state.ranking.selectedCourseId = courseId;
        }

        function setAdminScope(scope, grade = state.ranking.adminSelectedGrade, courseId = null) {
            state.ranking.adminScope = scope;
            state.ranking.adminSelectedGrade = grade;
            state.ranking.adminSelectedCourseId = courseId;
        }

        async function fetchRankingEntries() {
            if (!hasRankingEndpoint()) {
                state.ranking.entries = [];
                state.ranking.syncMessage = 'まだ接続先が未設定です。';
                return;
            }

            state.ranking.loading = true;
            state.ranking.syncMessage = 'ランキングを読み込み中...';
            render();

            try {
                const requestInfo = getRankingRequestInfo();
                const params = new URLSearchParams({
                    mode: requestInfo.mode,
                    limit: String(requestInfo.limit)
                });
                if (requestInfo.courseId) {
                    params.set('courseId', requestInfo.courseId);
                }
                const url = `${getRankingEndpoint()}?${params.toString()}`;
                const res = await fetch(url, { method: 'GET', cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                state.ranking.entries = Array.isArray(data.entries) ? data.entries : [];
                state.ranking.lastSyncAt = Date.now();
                state.ranking.syncMessage = state.ranking.entries.length
                    ? `最新取得: ${formatSyncTime(state.ranking.lastSyncAt)}`
                    : 'まだランキング登録がありません。';
            } catch (error) {
                state.ranking.syncMessage = 'ランキングの取得に失敗しました。接続先URLを確認してください。';
            } finally {
                state.ranking.loading = false;
                if (state.view === 'leaderboard') render();
            }
        }

        async function submitRankingScore(force = false) {
            if (!hasRankingEndpoint()) return false;

            const totalScore = state.userData.totalScore || 0;
            const lastSubmitted = state.userData.lastSubmittedRankingScore || 0;
            const nicknameError = validateNickname(state.userData.nickname || '');
            if (!force && totalScore <= 0) return false;
            if (!force && totalScore <= lastSubmitted) return false;
            if (nicknameError) {
                state.ranking.syncMessage = `ランキング送信前にニックネームを修正してください。${nicknameError}`;
                return false;
            }

            const courseBestScores = Object.entries(state.userData.bestScores || {})
                .map(([courseId, bestScore]) => {
                    const course = getCourseMeta(courseId);
                    if (!course || !['中学1年', '中学2年', '中学3年', '基本文'].includes(course.grade)) return null;
                    return {
                        courseId,
                        grade: course.grade,
                        category: course.category,
                        bestScore: Number(bestScore || 0)
                    };
                })
                .filter(entry => entry && entry.bestScore > 0);

            const payload = {
                anonymousId: state.userData.anonymousId,
                nickname: (state.userData.nickname || 'Player').slice(0, 20),
                totalScore,
                rankTitle: getCurrentRank().title,
                lastPlayedCourse: getCourseLabel(state.game.activeCourseId),
                updatedAt: new Date().toISOString(),
                courseBestScores
            };

            try {
                const res = await fetch(getRankingEndpoint(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data.ok) throw new Error(data.message || 'send failed');
                state.userData.lastSubmittedRankingScore = totalScore;
                saveData();
                state.ranking.lastSyncAt = Date.now();
                state.ranking.syncMessage = `送信完了: ${formatSyncTime(state.ranking.lastSyncAt)}`;
                return true;
            } catch (error) {
                state.ranking.syncMessage = 'スコア送信に失敗しました。接続先URLまたはニックネームを確認してください。';
                return false;
            }
        }

        function getAdminRequestInfo() {
            if (state.ranking.adminScope === 'course' && state.ranking.adminSelectedCourseId) {
                return {
                    mode: 'adminCourse',
                    courseId: state.ranking.adminSelectedCourseId,
                    limit: RANKING_CONFIG.courseLimit
                };
            }
            return {
                mode: 'adminOverall',
                courseId: null,
                limit: RANKING_CONFIG.overallLimit
            };
        }

        async function fetchAdminRankingEntries() {
            if (!hasRankingEndpoint()) {
                state.ranking.adminEntries = [];
                state.ranking.adminMessage = '先に接続先URLを設定してください。';
                return;
            }
            if (!hasAdminToken()) {
                state.ranking.adminEntries = [];
                state.ranking.adminMessage = '管理用トークンを入力してください。';
                return;
            }

            state.ranking.adminLoading = true;
            state.ranking.adminMessage = '管理データを読み込み中...';
            render();

            try {
                const requestInfo = getAdminRequestInfo();
                const params = new URLSearchParams({
                    mode: requestInfo.mode,
                    limit: String(requestInfo.limit),
                    adminToken: state.ranking.adminToken.trim()
                });
                if (requestInfo.courseId) params.set('courseId', requestInfo.courseId);
                const res = await fetch(`${getRankingEndpoint()}?${params.toString()}`, { method: 'GET', cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data.ok) throw new Error(data.message || 'admin fetch failed');
                state.ranking.adminEntries = Array.isArray(data.entries) ? data.entries : [];
                state.ranking.adminMessage = state.ranking.adminEntries.length ? '管理データを取得しました。' : 'データがありません。';
            } catch (error) {
                state.ranking.adminMessage = '管理データの取得に失敗しました。トークンかURLを確認してください。';
            } finally {
                state.ranking.adminLoading = false;
                if (state.view === 'leaderboard_admin') render();
            }
        }

        async function deleteRankingEntry(anonymousId) {
            if (!hasRankingEndpoint() || !hasAdminToken() || !anonymousId) return;
            state.ranking.adminMessage = '削除中...';
            renderLeaderboardAdmin();
            try {
                const res = await fetch(getRankingEndpoint(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'deletePlayer',
                        adminToken: state.ranking.adminToken.trim(),
                        anonymousId
                    })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data.ok) throw new Error(data.message || 'delete failed');
                state.ranking.adminMessage = '削除しました。';
                fetchAdminRankingEntries();
            } catch (error) {
                state.ranking.adminMessage = '削除に失敗しました。';
                renderLeaderboardAdmin();
            }
        }

        // Helper: Get Rank
        function getCurrentRank() {
            const score = state.userData.totalScore;
            return [...RANKS].reverse().find(r => score >= r.min) || RANKS[0];
        }

        function getNextRankInfo() {
            const score = state.userData.totalScore;
            const nextRank = RANKS.find(rank => score < rank.min);

            if (!nextRank) {
                return {
                    nextRank: null,
                    pointsNeeded: 0
                };
            }

            return {
                nextRank,
                pointsNeeded: nextRank.min - score
            };
        }

        function renderHistory() {
            const totalScore = state.userData.totalScore;
            const totalHighScore = Object.values(state.userData.bestScores).reduce((a, b) => a + b, 0);
            const playCount = state.userData.history.length;

            const gradeTabs = ['中学1年', '中学2年', '中学3年', '総復習', '基本文'];
            if (!gradeTabs.includes(state.selectedGrade)) {
                state.selectedGrade = '中学2年';
            }

            const bestSource = {};
            (state.userData.scoreLogs || []).forEach(log => {
                if (!log?.courseId || typeof log.score !== 'number') return;
                const prev = bestSource[log.courseId];
                if (!prev || log.score > prev.score || (log.score === prev.score && log.mode === 'review' && prev.mode !== 'review')) {
                    bestSource[log.courseId] = { score: log.score, mode: log.mode, grade: log.grade };
                }
            });
            const getReviewHighScoreByCourse = (courseId) => {
                const logs = state.userData.scoreLogs || [];
                const scores = logs.filter(log => log.mode === 'review' && log.courseId === courseId).map(log => log.score);
                return scores.length ? Math.max(...scores) : 0;
            };
            const getReviewHighScoreByGrade = (grade) => {
                const logs = state.userData.scoreLogs || [];
                const scores = logs.filter(log => log.mode === 'review' && log.grade === grade).map(log => log.score);
                return scores.length ? Math.max(...scores) : 0;

            const gradeButtonsHtml = gradeTabs.map(grade => {

                    : 'bg-indigo-50 text-indigo-500 border border-indigo-100 hover:bg-indigo-100';
                return `

                    ${grade}

            }).join('');

            const scoreListHtml = state.selectedGrade === '総復習'
                ? [
                    ...['中学1年', '中学2年', '中学3年'].map(grade => {

                        const displayScore = Math.max(normalScore, reviewScore);
                        const scoreLabel = displayScore === 0 ? '未プレイ' : `${displayScore.toLocaleString()} pt`;

                    <div class="bg-white p-3 rounded-xl border border-slate-100 flex justify-between items-center">

                    const displayScore = Math.max(normalScore, reviewScore);
                    const scoreLabel = displayScore === 0 ? '未プレイ' : `${displayScore.toLocaleString()} pt`;

        // Prepare Game: Setup state -> Countdown -> Start
        function prepareGame(courseId) {
            let questions = null;
            let courseScores = null;
            if (courseId === 'review1' || courseId === 'review2' || courseId === 'review3') {
                const gradeMap = {
                    review1: '中学1年',
                    review2: '中学2年',
                    review3: '中学3年'
                };
                const selectedReviewGrade = gradeMap[courseId];
                const pool = ENGLISH_KNOCK_CONTENT.filter(c => c.grade === selectedReviewGrade);
                questions = pool.flatMap(c => c.questions.map(q => ({ ...q, courseId: c.id })));
                courseScores = {};
                state.mode = courseId;
                state.reviewContext = { enabled: true, grade: selectedReviewGrade };
            } else if (String(courseId).startsWith('basic_')) {
                const course = getCourseMeta(courseId);
                questions = getBasicSentenceQuestions(courseId);
                state.mode = 'basic';
                state.reviewContext = {
                    enabled: false,
                    grade: course?.displayLabel || '基本文',
                    category: '基本文'
                };
            } else {
                const course = ENGLISH_KNOCK_CONTENT.find(c => c.id === courseId);
                if (!course) return;
                questions = course.questions.map(q => ({ ...q, courseId: courseId }));
                state.mode = 'normal';
                state.reviewContext = null;
            }
            if (!questions || questions.length === 0) return;

            // Initialize State
            const gameDuration = (state.mode === 'review1' || state.mode === 'review2' || state.mode === 'review3') ? 90 : 60;
            const courseMeta = getCourseMeta(courseId);
            state.game = {
                activeCourseId: courseId,
                timeLeft: gameDuration,
                score: 0,
                combo: 0,
                maxCombo: 0,
                questionQueue: shuffleQuestionsWithoutRepeat(questions),
                courseScores,
                currentQ: null,
                shuffledChunks: [],
                selectedIndices: [],
                isCorrect: null,
                wrongAnswers: [],
                correctCount: 0,
                attemptCount: 0,
                contextLabel: courseMeta?.category || '',
                startTime: 0, // Set when actual game starts
                timerInterval: null
            };

            // Start Countdown
            state.view = 'countdown';
            render();

            let count = 3;
            playTone(800, 'sine', 0.1); // Beep
            
            const countInterval = setInterval(() => {
                count--;
                const el = document.getElementById('countdown-display');
                if (count > 0) {
                    if (el) {
                        el.innerText = count;
                        // Trigger reflow for animation restart
                        el.classList.remove('animate-count');
                        void el.offsetWidth;
                        el.classList.add('animate-count');
                    }
                    playTone(800, 'sine', 0.1); // Beep
                } else {
                    clearInterval(countInterval);
                    if (el) el.innerText = "GO!";
                    playTone(1200, 'triangle', 0.3); // High Beep
                    setTimeout(() => startGameLogic(), 500);
                }
            }, 1000);
        }

        function startGameLogic() {
            state.view = 'game';
            state.game.startTime = Date.now();
            loadQuestion(state.game.questionQueue[0]);

            // Start Timer (No Full Re-render)
            state.game.timerInterval = setInterval(() => {
                if (state.game.timeLeft <= 1) {
                    finishSession();
                } else {
                    state.game.timeLeft--;
                    // Direct DOM update to prevent flickering
                    const timerEl = document.getElementById('timer-display');
                    if (timerEl) {
                        timerEl.innerText = state.game.timeLeft;
                    }
                }
            }, 1000);

            render();
        }

        function loadQuestion(q) {
            state.game.currentQ = q;
            state.game.shuffledChunks = q.chunks
                .map((text, i) => ({ id: `${i}-${text}`, text }))
                .sort(() => Math.random() - 0.5);
            state.game.selectedIndices = [];
            state.game.isCorrect = null;
            state.game.startTime = Date.now(); // Reset time for each question speed bonus
            renderGame();
        }

        function handleChunkClick(index) {
            if (state.game.isCorrect !== null) return;
            if (state.game.selectedIndices.includes(index)) return;

            state.game.selectedIndices.push(index);
            
            if (state.game.selectedIndices.length === state.game.currentQ.chunks.length) {
                checkAnswer();
            } else {
                renderGame();
            }
        }

        // New Feature: Cancel clicked answer
        function handleAnswerClick(answerOrderIndex) {
            if (state.game.isCorrect !== null) return;
            // Remove the clicked item from selectedIndices
            // splice changes the array in place
            state.game.selectedIndices.splice(answerOrderIndex, 1);
            renderGame();
        }

        function handleUndo() {
            if (state.game.isCorrect !== null) return;
            state.game.selectedIndices.pop();
            renderGame();
        }

        function checkAnswer() {
            const userSentence = state.game.selectedIndices.map(i => state.game.shuffledChunks[i].text).join('');
            const correctSentence = state.game.currentQ.chunks.join('');
            const elapsed = (Date.now() - state.game.startTime) / 1000;
            state.game.attemptCount++;

            if (userSentence === correctSentence) {
                state.game.isCorrect = true;
                state.game.correctCount++;
                speakText(state.game.currentQ.text);

                const timeBonus = Math.max(10, Math.floor(150 - (elapsed * 5)));
                const comboBonus = Math.min(50, state.game.combo * 10);
                const gained = timeBonus + comboBonus;
                state.game.score += gained;
                if (state.game.courseScores && state.game.currentQ?.courseId) {
                    const cid = state.game.currentQ.courseId;
                    state.game.courseScores[cid] = (state.game.courseScores[cid] || 0) + gained;
                }
                state.game.combo++;
                if (state.game.combo > state.game.maxCombo) state.game.maxCombo = state.game.combo;

                renderGame();

                // BUG FIX: Ensure game is still active before loading next
                setTimeout(() => {
                    if (state.view !== 'game') return; // Exit if game finished

                    const nextIdx = (state.game.questionQueue.indexOf(state.game.currentQ) + 1) % state.game.questionQueue.length;
                    loadQuestion(state.game.questionQueue[nextIdx]);
                }, 700); // SPEED UP: 1500 -> 700

            } else {
                state.game.isCorrect = false;
                state.game.combo = 0;
                const current = state.game.currentQ;
                if (current) {
                    const exists = state.game.wrongAnswers.some(
                        w => w.courseId === current.courseId && w.text === current.text && (w.context || '') === (current.context || '')
                    );
                    if (!exists) {
                        state.game.wrongAnswers.push({
                            courseId: current.courseId,
                            category: getCourseMeta(current.courseId)?.category || '',
                            text: current.text,
                            jp: current.jp,
                            context: current.context || ''
                        });
                    }
                }
                renderGame();

                const overlay = document.getElementById('wrong-overlay');
                if (overlay) {
                    overlay.classList.remove('hidden');
                    setTimeout(() => {
                        overlay.classList.add('hidden');
                    }, 500);
                }

                setTimeout(() => {
                    if (state.view !== 'game') return; // Exit if game finished
                    const nextIdx = (state.game.questionQueue.indexOf(state.game.currentQ) + 1) % state.game.questionQueue.length;
                    loadQuestion(state.game.questionQueue[nextIdx]);
                }, 800);
            }
        }

        async function finishSession() {
            if (state.game.timerInterval) clearInterval(state.game.timerInterval);
            state.game.timerInterval = null; // Clear ref
            
            state.userData.totalScore += state.game.score;
            if ((state.mode === 'review1' || state.mode === 'review2' || state.mode === 'review3') && state.game.courseScores) {
                Object.entries(state.game.courseScores).forEach(([courseId, score]) => {
                    const currentBest = state.userData.bestScores[courseId] || 0;
                    state.userData.bestScores[courseId] = Math.max(currentBest, score);
                });
            } else {
                const currentBest = state.userData.bestScores[state.game.activeCourseId] || 0;
                state.userData.bestScores[state.game.activeCourseId] = Math.max(currentBest, state.game.score);
            }
            
            state.userData.history.unshift({
                date: new Date().toISOString(),
                courseId: state.game.activeCourseId,
                score: state.game.score,
                maxCombo: state.game.maxCombo,
                correctCount: state.game.correctCount,
                attemptCount: state.game.attemptCount
            });
            if (state.userData.history.length > 50) state.userData.history.pop();

            state.userData.scoreLogs.push({
                courseId: state.game.activeCourseId,
                score: state.game.score,
                mode: state.mode === 'basic' ? 'basic' : (state.reviewContext?.enabled ? 'review' : 'normal'),
                grade: state.reviewContext?.grade ?? null,
                category: state.reviewContext?.category ?? null,
                correctCount: state.game.correctCount,
                attemptCount: state.game.attemptCount,
                timestamp: Date.now()
            });
            if (state.userData.scoreLogs.length > 200) state.userData.scoreLogs.shift();
            
            saveData();
            await submitRankingScore();
            
            state.view = 'mistake_review';
            render();
        }

        function renderMistakeReview() {
            const { score, maxCombo, wrongAnswers, correctCount, attemptCount } = state.game;
            const mistakes = wrongAnswers || [];
            const accuracy = attemptCount > 0 ? Math.round((correctCount / attemptCount) * 100) : 0;
            const itemsHtml = mistakes.length === 0
                ? `<div class="bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl p-4 font-bold text-sm">全問正解でした。復習問題はありません。</div>`
                : mistakes.map((m, i) => `
                    <div class="bg-white border border-slate-200 rounded-xl p-4 text-left">
                        <div class="text-xs text-indigo-500 font-bold mb-1">#${i + 1} ${m.category || ''}</div>
                        ${m.context ? `
                        <div class="bg-sky-50 border border-sky-100 text-sky-700 rounded-lg p-2 text-xs font-bold mb-2">
                            <div class="text-[10px] text-sky-400 mb-0.5">前の文</div>
                            ${m.context}
                        </div>` : ''}
                        <div class="text-slate-800 font-bold text-sm leading-relaxed">${m.text}</div>
                        <div class="text-slate-500 text-sm mt-1">${m.jp}</div>
                    </div>
                `).join('');

            app.innerHTML = `
                <div class="app-root bg-indigo-50">
                    <header class="header bg-indigo-600 p-6 pt-8 pb-8 rounded-b-[2rem] shadow-lg mb-4 text-white text-center">
                        <div class="text-indigo-200 font-bold text-xs uppercase tracking-widest mb-1">Session Complete</div>
                        <h2 class="text-2xl font-extrabold">復習ページ</h2>
                        <div class="mt-3 flex justify-center gap-3 flex-wrap">
                            <div class="bg-white/10 backdrop-blur px-3 py-2 rounded-xl text-sm font-bold">Score: ${score}</div>
                            <div class="bg-white/10 backdrop-blur px-3 py-2 rounded-xl text-sm font-bold">Max Combo: ${maxCombo}</div>
                            <div class="bg-white/10 backdrop-blur px-3 py-2 rounded-xl text-sm font-bold">正答率: ${accuracy}%</div>
                        </div>
                    </header>

                    <main class="content px-4 pb-4">
                        <div class="font-bold text-slate-700 text-sm mb-2">間違えた問題（${mistakes.length}問）</div>
                        <div class="space-y-3 pb-4">
                            ${itemsHtml}
                        </div>
                    </main>

                    <footer class="header p-4 bg-white border-t border-slate-100 flex gap-3">
                        <button
                            onclick="prepareGame('${state.game.activeCourseId}')"
                            class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition-colors"
                        >
                            もう一度挑戦
                        </button>
                        <button
                            onclick="goMenu()"
                            class="flex-1 bg-slate-100 text-slate-700 font-bold py-3 rounded-xl hover:bg-slate-200 transition-colors"
                        >
                            メニューへ戻る
                        </button>
                    </footer>
                </div>
            `;
        }

        function retryGame() {
            prepareGame(state.game.activeCourseId); // Use prepareGame for countdown
        }

        function exitGame() {
            if (state.game.timerInterval) clearInterval(state.game.timerInterval);
            goMenu();
        }

        function confirmExitGame() {
            if (confirm('ゲームを中断してホームに戻りますか？')) {
                exitGame();
            }
        }

        // Initialize
        render();

    </script>
